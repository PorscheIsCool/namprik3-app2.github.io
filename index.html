<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สูตรน้ำพริกไทย 100+ เมนู</title>
<style>
  body { font-family: 'Sarabun', 'Tahoma', sans-serif; background: #fdfaf6; color: #333; margin: 0; padding: 20px; }
  .wrap { max-width: 960px; margin: auto; }
  h1 { color: #d9534f; text-align: center; margin-bottom: 5px; }
  .stats { text-align: center; font-size: 14px; color: #666; margin-bottom: 15px; }
  .bar { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 15px; }
  #q { flex: 1; min-width: 220px; border: 2px solid #e0d8cc; }
  .btn-add { background: #28a745; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab { padding: 6px 12px; border: 1px solid #d9534f; background: #fff; color: #d9534f; border-radius: 20px; cursor: pointer; font-size: 14px; }
  .tab.on { background: #d9534f; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #e0d8cc; border-radius: 8px; padding: 14px; cursor: pointer; }
  .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
  .tag { background: #fce8e6; color: #d9534f; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 15px; z-index: 99; }
  .box { background: #fff; padding: 20px; border-radius: 10px; max-width: 550px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; }
  .close { position: absolute; top: 12px; right: 15px; font-size: 24px; cursor: pointer; border: none; background: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>สูตรน้ำพริกไทย</h1>
  <div class="stats" id="st">กำลังโหลด...</div>
  <div class="bar">
    <input type="text" id="q" placeholder="ค้นหาชื่อน้ำพริก หรือ วัตถุดิบ (เช่น ปลาช่อน, ไข่เค็ม, ปู, มะดัน)...">
    <button class="btn-add" onclick="openM('mAdd')">+ เพิ่มสูตรใหม่</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" onclick="setCat('ทั้งหมด',this)">ทั้งหมด</button>
    <button class="tab" onclick="setCat('กุ้ง/ปู',this)">กุ้ง / ปู</button>
    <button class="tab" onclick="setCat('ปลา/ปลาร้า',this)">ปลา / ปลาร้า</button>
    <button class="tab" onclick="setCat('หมู/ไก่/เนื้อ',this)">หมู / ไก่ / เนื้อ</button>
    <button class="tab" onclick="setCat('ไข่',this)">เมนูไข่</button>
    <button class="tab" onclick="setCat('ผัก/ผลไม้',this)">ผัก / ผลไม้</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="mView" onclick="if(event.target===this)closeM('mView')">
  <div class="box">
    <button class="close" onclick="closeM('mView')">&times;</button>
    <span class="tag" id="vCat"></span>
    <h2 id="vName" style="color:#d9534f;margin:8px 0"></h2>
    <h4>เครื่องปรุง</h4><ul id="vIng"></ul>
    <h4>วิธีปรุง</h4><ol id="vStep"></ol>
  </div>
</div>

<div class="modal" id="mAdd" onclick="if(event.target===this)closeM('mAdd')">
  <div class="box">
    <button class="close" onclick="closeM('mAdd')">&times;</button>
    <h3 style="color:#28a745;margin-top:0">เพิ่มสูตรน้ำพริกใหม่</h3>
    <input id="nName" placeholder="ชื่อน้ำพริก" style="width:100%;box-sizing:border-box;margin-bottom:8px">
    <select id="nCat" style="width:100%;margin-bottom:8px">
      <option value="กุ้ง/ปู">กุ้ง / ปู</option>
      <option value="ปลา/ปลาร้า">ปลา / ปลาร้า</option>
      <option value="หมู/ไก่/เนื้อ">หมู / ไก่ / เนื้อ</option>
      <option value="ไข่">เมนูไข่</option>
      <option value="ผัก/ผลไม้">ผัก / ผลไม้</option>
    </select>
    <textarea id="nIng" rows="4" placeholder="เครื่องปรุง (ขึ้นบรรทัดใหม่เพื่อแยกรายการ)" style="width:100%;box-sizing:border-box;margin-bottom:8px"></textarea>
    <textarea id="nStep" rows="4" placeholder="วิธีปรุง (ขึ้นบรรทัดใหม่เพื่อแยกขั้นตอน)" style="width:100%;box-sizing:border-box;margin-bottom:10px"></textarea>
    <button class="btn-add" style="width:100%" onclick="addNew()">บันทึกสูตร</button>
  </div>
</div>

<script>
const raw = `
น้ำพริกก้อย สูตร 1 :: กุ้ง/ปู :: กุ้งนาง 1ตัว, น้ำพริกเผา 1ชต., ถั่วเขียว 1/2ถ้วย, มะพร้าวขูด 300ก., น้ำตาลทราย 2ชช., น้ำมะนาว 2ชต., น้ำปลา 3-4ชต., น้ำมะขามเปียก 2ชต., น้ำสะเออะ และมันกุ้ง :: ล้างกุ้ง ปอกเปลือก นึ่งมันกุ้งให้สุก | คั่วถั่วต้มจนเปื่อย คั้นหัวกะทิ 2/3ถ้วย | โขลกกุ้ง มันกุ้ง ถั่ว น้ำพริกเผาให้ละเอียด | ผัดหัวกะทิพอแตกมัน ใส่เครื่องโขลก ปรุงรส เติมน้ำสะเออะต้มเดือด
น้ำพริกก้อย สูตร 2 :: กุ้ง/ปู :: กะปิเผา 1ชต., พริกชี้ฟ้าเขียวแดงย่าง 10เม็ด, หอมแดงเผา 5หัว, กระเทียมเผา 5หัว, กุ้งนางเผา 1ตัว, น้ำปลาร้าต้มกรอง 1ถ้วย, เนื้อปลาดุกย่างแกะ 1ตัว, ข้าวคั่ว 1ชต., น้ำมะนาว 3ผล, ตะไคร้ ใบสะระแหน่ :: โขลกกระเทียม หอม พริก กะปิ ใส่ในน้ำปลาร้า | ใส่เนื้อปลาดุกฉีก เนื้อกุ้งเผาฉีก โขลกเบาๆ | เติมน้ำมะนาว ข้าวคั่ว โรยใบสะระแหน่
น้ำพริกกระเทียมสุก :: ผัก/ผลไม้ :: พริกแห้ง 100ก., เกลือป่น 30ก., กระเทียมแกะเปลือกนึ่งสุก 200ก., น้ำมะขามเปียก 2-3ชต., น้ำตาล 2ชต., น้ำมะนาว 6-7ชต. :: แช่พริกแห้ง แกะเมล็ด ซอยหยาบ โขลกกับเกลือ | ใส่กระเทียมนึ่งสุกโขลกให้เข้ากัน ปรุงรสด้วยน้ำมะขาม น้ำปลา น้ำตาล มะนาว
น้ำพริกกระเทียมโทน :: ผัก/ผลไม้ :: กระเทียมโทนแกะเปลือก 10หัว, กะปิเผา 1ชต., พริกขี้หนูสวน 15เม็ด, กระเทียม 1หัว, มะอึกซอย 1ลูก, แมงดานาปิ้ง 1ตัว, น้ำปลาดี น้ำมะนาว น้ำตาลปี๊บ :: โขลกกะปิเผา พริกขี้หนู กระเทียม มะอึก แมงดานาให้ละเอียด | ปรุงรสสามรส โรยกระเทียมโทนไว้ข้างหน้า
น้ำพริกกลางดง สูตร 1 :: กุ้ง/ปู :: กุ้งแห้งทอด 100ก., พริกชี้ฟ้าแห้ง 10เม็ด, หอมซอยเจียว 1/2ถ้วย, กระเทียมซอยเจียว 1/4ถ้วย, น้ำส้มมะขามเปียก 2-3ชต., น้ำปลา 2ชต., เกลือ 1/2ชช., น้ำตาลทราย 1/2-1ชช., น้ำมัน 1-2ชต. :: แช่พริกแห้ง หั่นตามขวางบางๆ ทอดให้กรอบ | ทอดกุ้งแห้งให้เหลืองกรอบ | ผัดเครื่องทั้งหมดรวมกัน ปรุงรสจนน้ำพริกแห้ง
น้ำพริกกลางดง สูตร 2 :: กุ้ง/ปู :: พริกแห้ง 80-100ก., กุ้งแห้งอย่างดี 500ก., หอมแดงซอย 100ก., กระเทียมซอย 60-80ก., น้ำปลา 5-7ชต., น้ำตาลปี๊บ 3-4ชต., น้ำส้มมะขาม 7-8ชต. :: ทอดกุ้งแห้ง หอมแดงซอย กระเทียมซอย และพริกแห้งซอยแยกทีละอย่าง | โขลกพริก หอม กระเทียม กุ้งแห้งเบาๆ | เคี่ยวน้ำตาล น้ำปลา ส้มมะขามให้เข้ากัน คลุกเครื่องน้ำพริกให้ทั่ว
น้ำพริกกล้วยดิบ :: กุ้ง/ปู :: กล้วยน้ำว้าดิบ 12-15ผล, กุ้งนางเผาหั่นชิ้น 250-280ก., กุ้งแห้งป่น 150-180ก., พริกขี้หนูสวน 60-70ก., กระเทียม 60-80ก., มันกุ้งนึ่ง 3-4ชต., น้ำปลา 6-7ชต., น้ำมะนาว 6-8ชต., น้ำตาลปี๊บ 3-5ชต. :: ซอยกล้วยดิบบางๆ แช่น้ำมะขาม สะเด็ดน้ำแล้วโขลกเบาๆ กับกระเทียม พริก กุ้งแห้งป่น | ใส่กุ้งเผาคลึงเบาๆ ปรุงรส | ผัดกับน้ำมันพืชจนสุกหอม
น้ำพริกกะปิ สูตร 1 :: กุ้ง/ปู :: กะปิเผา 300ก., กุ้งแห้งป่น 200ก., กระเทียมสด 100ก., พริกขี้หนูสวน 50-70ก., มะเขือเปราะซอย 50ก., มะอึกซอย 50ก., น้ำมะนาว 6-8ชต., น้ำปลา 2-4ชต., น้ำตาลปี๊บ 3-5ชต. :: โขลกกะปิ กระเทียม พริกขี้หนู ใส่กุ้งแห้งป่นโขลกต่อ | ใส่มะเขือเปราะ มะอึก โขลกเบาๆ ปรุงรสสามรส
น้ำพริกกะปิ สูตร 2 :: กุ้ง/ปู :: กะปิเผา 2ชต., กระเทียมซอยหยาบ 1ชต., กุ้งแห้งป่น 1ชต., พริกขี้หนู 1ชช., มะอึกสุกหั่นฝอย 1ชต., ระกำซอย 1ชต., น้ำมะนาว 3ชต., น้ำปลา 3ชต., น้ำตาลปี๊บ 2-3ชต., มะเขือพวง 1ชต. :: โขลกกะปิกับกระเทียมให้ละเอียด ใส่กุ้งแห้งโขลกรวมกัน | ใส่พริกขี้หนู มะอึก ระกำ มะเขือพวง ปรุงรสสามรส
น้ำพริกกะปิกุ้งนา :: กุ้ง/ปู :: พริกขี้หนูแห้ง 200ก., หอมแดง 300ก., กระเทียม 150ก., กะปิเผา 5ชต., มะขามเปียก 300ก., น้ำตาลปี๊บ 100ก., เกลือ 1-2ชต., กุ้งนาต้มสุก 300ก., น้ำมันพืช 4ชต. :: คั่วพริก หอม กระเทียมในน้ำมัน โขลกกับกะปิและกุ้งนาต้มสุก | ผัดน้ำมันจนหอม ปรุงรสด้วยน้ำมะขาม น้ำตาลปี๊บ เกลือ
น้ำพริกกะปิดี :: กุ้ง/ปู :: กะปิดีเผา 1ชต., กระเทียม 1หัว, พริกขี้หนูสวน 10เม็ด, น้ำมะนาว 1ผล, น้ำปลาดี 1ชช., น้ำตาลปี๊บ 2ชช., มะเขือพวง 10เม็ด, มะอึกขูดขน 1ลูก :: โขลกกะปิ กระเทียม พริกขี้หนูพอแตก | ใส่มะอึก มะเขือพวง บุบให้แตกเล็กน้อย ปรุงรสสามรส
น้ำพริกกากหมู สูตร 1 :: หมู/ไก่/เนื้อ :: กากหมูเจียว 1ถ้วย, พริกชี้ฟ้าเผา 5เม็ด, หอมแดงเผา 3หัว, กระเทียมเผา 1หัว, มะดันซอยละเอียด 2ผล, น้ำปลาดี น้ำตาลปี๊บ :: โขลกหอมเผา กระเทียมเผา กากหมู มะดันซอยเข้าด้วยกัน | ปรุงรสด้วยน้ำปลาดี น้ำตาลปี๊บ
น้ำพริกกากหมู สูตร 2 :: หมู/ไก่/เนื้อ :: กากหมู 1ถ้วย, หมูหยอง 1/2ถ้วย, พริกชี้ฟ้าเผา 6-8เม็ด, หอมแดงเผา 6หัว, กระเทียมเผา 2หัว, มะอึกหั่นฝอย 1ชต., ระกำ 2ลูก, มะนาว 1ลูก, น้ำปลา 3-4ชต., น้ำตาล 1ชช. :: เผาพริก หอม กระเทียม โขลกละเอียด ใส่กากหมูและหมูหยองโขลกให้เข้ากัน | ฝานระกำใส่ ใส่มะอึก บีบมะนาว ใส่น้ำปลา เคล้าให้เข้ากัน
น้ำพริกกุ้งจ่อม :: กุ้ง/ปู :: กุ้งจ่อมอย่างดี 1ถ้วย, พริกขี้หนูสดหั่น 1ชต., หอมแดงหั่น 2ชต., ขิงอ่อนหั่นฝอย 2ชต., มะเขือเหลืองหั่นแว่น 2ชต., ตะไคร้หั่นฝอย 1ชต., ใบมะกรูดหั่นฝอย 1ชต. :: เทกุ้งจ่อมใส่หม้อตั้งไฟอ่อน จนเดือดเบาๆ แล้วปิดไฟ | เทเครื่องปรุงส่วนที่เหลือทั้งหมด คนให้เข้ากัน
น้ำพริกกุ้งป่นพริกขี้หนู :: กุ้ง/ปู :: กุ้งแห้งอย่างดี 2ถ้วย, พริกขี้หนูแห้ง 15-20เม็ด, เกลือ 1/2-1ชช. :: อบกุ้งแห้งให้สุก โขลกให้ละเอียด | อบพริกขี้หนูพอสุกอย่าให้ดำ โขลกละเอียด เคล้ากับกุ้งแห้งและเกลือ
น้ำพริกกุ้งเผามะเขือพวง :: กุ้ง/ปู :: เนื้อกุ้งเผา 4ตัว, กระเทียม 9กลีบ, พริกขี้หนู 9เม็ด, กะปิดีเผา 1/2ชช., มะเขือพวง 25ลูก, น้ำตาลปี๊บ 1/2ชช., น้ำมะนาว 2ชช., มะเขือเทศสุกหั่น 1/4ถ้วย, น้ำปลาดี :: โขลกกระเทียม กะปิ พริกขี้หนู มะเขือพวงพอบุบแตก ปรุงรสสามรส | ใส่มะเขือเทศสุกและเนื้อกุ้งเผาฉีก คลุกเคล้าให้เข้ากัน
น้ำพริกกุ้งมะเขือเผา :: กุ้ง/ปู :: เนื้อกุ้งเผา 1ถ้วย, หอมแดง 9หัว, กระเทียม 4หัว, พริกชี้ฟ้าแดง 9เม็ด, มะเขือเทศลูกเล็ก 9ลูก, น้ำมะนาว 1.5ชต., น้ำปลาดี 1ชต., เนื้อมะเขือยาวเผา 1/2ถ้วย, ไข่ต้ม 4ฟอง :: โขลกกุ้ง มะเขือเทศ พริกชี้ฟ้า หอมแดง กระเทียม กะปิเผา และมะเขือยาวเผาพอหยาบ | ปรุงรสด้วยน้ำปลาดี น้ำตาลปี๊บ น้ำมะนาว เสิร์ฟคู่ไข่ต้ม
น้ำพริกกุ้งสด สูตร 1 :: กุ้ง/ปู :: กุ้งสดสับ 1/2ถ้วย, กะปิดีเผา 1ชต., กระเทียม 1หัว, มะเขือพวง 10เม็ด, พริกขี้หนูสวน 15เม็ด, น้ำมะนาว 1ผล, น้ำปลาดี :: โขลกพริกขี้หนู กระเทียม กะปิให้เข้ากัน ใส่มะเขือพวงบุบพอแตก | ใส่เนื้อกุ้งสดสับคลุกเคล้า ปรุงรสด้วยมะนาว น้ำปลาดี
น้ำพริกถั่วเหลือง :: ผัก/ผลไม้ :: พริกแห้งเม็ดโต 50ก., หอมซอยเจียว 2ถ้วย, กระเทียมซอยเจียว 1ถ้วย, ถั่วเหลืองนึ่งสุกป่นละเอียด 1ถ้วย, ซีอิ๊วขาว 3ชต., น้ำตาลปี๊บ 5ชต., น้ำส้มมะขามเปียก, น้ำมันพืช :: เจียวกระเทียม หอมซอยให้เหลืองหอม ทอดพริกแห้งให้กรอบ โขลกให้ละเอียด | เคี่ยวน้ำตาล ซีอิ๊วขาว น้ำส้มมะขามเปียกให้เหนียว | นำเครื่องที่โขลกและถั่วเหลืองป่นลงผสมคลุกเคล้าให้เข้ากัน
น้ำพริกนรก สูตร 1 :: ปลา/ปลาร้า :: ปลากรอบ 1ถ้วย, พริกแห้ง 10เม็ด, พริกขี้หนูแห้ง 20ก., หอมแดง 10หัว, กระเทียม 5หัว, มะขามเปียกสับละเอียด 1/2ถ้วย, เกลือ 1ชต. :: คั่วพริกแห้ง พริกขี้หนูแห้ง เผามะขามเปียก คั่วปลากรอบ เผาหอมกระเทียม | โขลกทุกอย่างรวมกับเกลือจนละเอียดเข้ากันดี
น้ำพริกนรก สูตร 2 :: ปลา/ปลาร้า :: ปลากรอบรมควัน 500ก., พริกแห้งใหญ่ 60-80ก., พริกขี้หนูแห้ง 100ก., หอมแดงเผา 80-100ก., กระเทียมเผา 70-80ก., มะขามเปียกเผา 150-180ก., เกลือป่น 2ชต., น้ำตาลปี๊บ 4-5ชต. :: คั่วเนื้อปลากรอบ คั่วพริก เผามะขามเปียก หอม กระเทียม | โขลกมะขามเปียก หอม กระเทียม พริกแห้งให้ละเอียด ใส่เนื้อปลากรอบและเกลือโขลกต่อให้กลมกลืน
น้ำพริกนรกกุ้งแมงดา :: กุ้ง/ปู :: กุ้งแห้ง 1ถ้วย, พริกแห้ง 10เม็ด, พริกขี้หนูแห้ง 15-20เม็ด, หอมแดง 10หัว, กระเทียม 5หัว, มะขามเปียก 3-4ชต., เกลือ 2ชช., แมงดาหอม 1-2ตัว :: นึ่งแมงดา แกะตา ปีก ฉีกเป็นชิ้นๆ คั่วกุ้งแห้งโขลกละเอียด | คั่วพริก เผาหอมกระเทียม ย่างมะขามเปียกสับละเอียด | โขลกทุกอย่างรวมกับเกลือ กุ้ง และแมงดาให้เข้ากัน
น้ำพริกนรกกุ้งแห้ง :: กุ้ง/ปู :: กุ้งแห้งป่น 3/4ถ้วย, พริกขี้หนูแห้งคั่วป่น 1/2ถ้วย, หอมแดง 4ชต., กระเทียม 4ชต., กะปิ 2ชช., มะขามเปียกสับ 4ชต., น้ำปลาดี 3-5ชต. :: โขลกหอม กระเทียม กุ้งแห้ง พริกขี้หนู มะขามเปียก และกะปิให้เข้ากัน | นำลงผัดในกระทะไฟอ่อนไม่ต้องใส่น้ำมัน ปรุงรสด้วยน้ำปลาดีจนแห้ง
น้ำพริกนางลอย สูตร 1 :: ปลา/ปลาร้า :: หอมเผา 2ชต., กระเทียมเผา 3ชต., กะปิเผา 2ชต., ปลากรอบปิ้งโขลกละเอียด 1/2ถ้วย, มะอึก 5-6ผล, ระกำซอย 1-2ผล, พริกชี้ฟ้าเผา 10-15เม็ด, พริกขี้หนูเผา 25เม็ด, น้ำปลา 3ชต., น้ำมะนาว 3ชต., น้ำตาล 1-2ชต. :: โขลกพริกชี้ฟ้า พริกขี้หนู หอม กระเทียม กะปิ พอแหลกใส่ปลากรอบ | ใส่มะอึกซอย ระกำซอย ปรุงรสสามรส
น้ำพริกนางลอย สูตร 2 :: ปลา/ปลาร้า :: พริกชี้ฟ้าเหลืองแดงนึ่ง 300ก., หอมแดงเผา 100ก., กระเทียมเผา 60-70ก., กะปิเผา 60ก., ปลากรอบย่างไฟ 200ก., มะอึกซอย 10ลูก, ระกำซอย 7ลูก, พริกขี้หนูสวน 60-70ก., น้ำปลา 5-6ชต., น้ำมะนาว 7-9ชต. :: โขลกเนื้อปลากรอบกับพริกชี้ฟ้านึ่ง หอม กระเทียม กะปิเผาจนละเอียด | ใส่มะอึกซอย ระกำซอย พริกขี้หนูบุบพอแตก ปรุงรสสามรส
น้ำพริกน้ำปลา :: กุ้ง/ปู :: พริกขี้หนูคั่วป่น 3ชช., กุ้งแห้งป่น 3ชต., น้ำปลาดี 4ชต., น้ำตาลปี๊บ 1ชช., หอมแดงซอย 2ชต. :: โขลกพริกขี้หนูคั่วกับกุ้งแห้งป่นให้ละเอียดเข้ากัน | ปรุงรสด้วยน้ำปลาดี น้ำตาลปี๊บ ใส่หอมแดงซอยคลุกเคล้า
น้ำพริกเนื้อเค็ม สูตร 1 :: หมู/ไก่/เนื้อ :: เนื้อเค็มย่าง 100ก., กะปิเผา 1ชต., กระเทียม 1หัว, หอมแดง 2หัว, พริกขี้หนูสวน 25-30เม็ด, น้ำตาลปี๊บ 1-2ชต., น้ำมะนาว 2ชต., น้ำปลาดี 1-2ชช. :: สับเนื้อเค็มย่างเป็นชิ้นเล็กๆ สับกระเทียม หอม พริกขี้หนูหยาบๆ | ผสมกับเนื้อเค็ม กะปิเผา มะนาว น้ำตาลปี๊บ คลุกให้เข้ากัน
น้ำพริกเนื้อเค็ม สูตร 2 :: หมู/ไก่/เนื้อ :: เนื้อเค็มย่าง 300ก., กะปิเผา 30ก., กระเทียม 15ก., หอมแดง 30ก., พริกขี้หนูสวน 25ก., น้ำตาลปี๊บ 2-3ชต., น้ำมะนาว 4-5ชต., น้ำปลา 1-2ชต. :: ย่างเนื้อเค็มหรือหมูเค็ม ฉีกเป็นเส้นซอยหยาบ | โขลกหอม กระเทียม กะปิ พริกขี้หนู คลุกเนื้อเค็ม ปรุงรสสามรส
น้ำพริกเนื้อแดดเดียว :: หมู/ไก่/เนื้อ :: เนื้อเค็มย่างฉีกฝอย 3ชต., กะปิดีเผา 1ชต., พริกขี้หนูสวน 15เม็ด, กระเทียม 1หัว, มะอึกขูดขนหั่นละเอียด 1ลูก, มะเขือพวง 10เม็ด, น้ำมะนาว น้ำปลาดี น้ำตาลปี๊บ :: โขลกกะปิ กระเทียม พริกขี้หนู เนื้อเค็ม มะอึกให้ละเอียด | ใส่มะเขือพวงบุบพอแตก ปรุงรสสามรส
น้ำพริกปลา :: ปลา/ปลาร้า :: พริกสดเผา 5-6เม็ด, หอมเผา 5หัว, กระเทียมเผา 2หัว, เนื้อปลา 200ก., ปลาร้า 1ชช., เกลือ 1ชต., น้ำ 1.5ถ้วย, ต้นหอม ผักชี 2ต้น :: โขลกพริก หอม กระเทียมเผาให้เข้ากัน | ต้มน้ำเดือดใส่ปลาและปลาร้า ต้มจนสุก แกะเนื้อปลาโขลกในน้ำพริก เติมน้ำต้มปลาร้ากรอง
น้ำพริกปลากรอบ :: ปลา/ปลาร้า :: ปลากรอบแกะเนื้อ 5ชต., น้ำปลาดี 3ชต., น้ำมะนาว 1ผล, หอมแดงซอย 2ชต., พริกขี้หนูหั่นซอย 15เม็ด :: โขลกปลากรอบเบาๆ พอหยาบ | ตักขึ้นผสมเครื่องปรุงทั้งหมด คลุกเคล้าให้เข้ากัน
น้ำพริกปลากรอบแห้ง :: ปลา/ปลาร้า :: ปลากรอบป่น 1ถ้วย, พริกขี้หนูสวนแห้งป่น 2ชต., กระเทียมเจียวโขลก 2ชต., เกลือ 1ชต. :: ย่างปลากรอบแกะเอาแต่เนื้อ | โขลกปลากรอบ พริกขี้หนู กระเทียมเจียว และเกลือเข้าด้วยกัน
น้ำพริกปลากระป๋อง :: ปลา/ปลาร้า :: ปลากระป๋องในซอสมะเขือเทศ 1กระป๋อง, หอมแดงซอย 2ชต., พริกขี้หนูหั่น 1ชต., น้ำปลา 2ชต., น้ำมะนาว 1-2ชต. :: เทปลากระป๋องใส่หม้อ ยีเนื้อปลา ตั้งไฟต้มให้เดือด | ยกลงใส่หอมแดง พริกขี้หนู เคล้าให้ทั่ว ปรุงรสด้วยน้ำปลา มะนาว
น้ำพริกปลากุเลา สูตร 1 :: ปลา/ปลาร้า :: เนื้อปลากุเลาปิ้งแกะ 1ถ้วย, พริกแห้งเม็ดใหญ่แช่น้ำ 10เม็ด, กระเทียม 3หัว, กะปิดีเผา 1ชต., น้ำปลาดี น้ำตาลปี๊บ น้ำมะนาว น้ำส้มมะขามเปียก, น้ำมันพืช :: โขลกพริกแห้งแช่น้ำ เนื้อปลากุเลา กระเทียม กะปิเผาให้ละเอียด ปรุงรสสามรส | นำลงผัดน้ำมันไฟอ่อนจนแห้งร่วน
น้ำพริกปลากุเลา สูตร 2 :: ปลา/ปลาร้า :: ปลากุเลาย่างแกะเนื้อ 400ก., พริกแห้งใหญ่คั่ว 40ก., หอมแดงเผา 100ก., กระเทียมเผา 60ก., ข่าหั่นละเอียดคั่ว 2-3ชต., มะขามเปียกสับละเอียด 60-70ก., เกลือป่น 1-2ชต. :: โขลกพริกแห้งคั่ว หอม กระเทียม ข่า มะขามเปียกให้เข้ากัน | ใส่เนื้อปลากุเลาและเกลือ โขลกต่อให้เข้ากันดี
น้ำพริกปลากุเลา สูตร 3 :: ปลา/ปลาร้า :: ปลากุเลาย่างแกะเนื้อ 1/2ถ้วย, พริกแห้งเม็ดใหญ่คั่ว 10เม็ด, กระเทียมเผา 5หัว, หอมแดงเผา 6หัว, ข่าหั่นละเอียดคั่ว 1ชต., มะขามเปียกสับ 1/4ถ้วย, เกลือ 1ชช. :: โขลกพริกแห้ง หอม กระเทียม ข่า มะขามเปียก และเกลือเข้าด้วยกัน | ใส่เนื้อปลากุเลาโขลกต่อให้ละเอียด
น้ำพริกปลาเค็มนึ่ง :: หมู/ไก่/เนื้อ :: ปลาเค็มหรือปลาทูเค็มแกะเนื้อ 100ก., หมูสามชั้น 300ก., พริกขี้หนูสับหยาบ 2ชต., ตะไคร้หั่นฝอย 2ชต., ใบมะกรูดหั่นฝอย 1ชช., หอมแดงหั่นบาง 1/4ถ้วย, ไข่ไก่ 2ฟอง, น้ำตาลทราย 1-2ชต., มะนาว 1ลูก :: สับปลาเค็มและหมูสามชั้นให้ละเอียด คลุกเคล้ากับสมุนไพร ไข่ไก่ และน้ำตาล | นำขึ้นนึ่งจนสุก ก่อนเสิร์ฟยีเนื้อน้ำพริก บีบน้ำมะนาว โรยพริกสดและใบมะกรูด
น้ำพริกปลาช่อน :: ปลา/ปลาร้า :: ปลาช่อนย่างแกะเนื้อ 1ถ้วย, หอมแดงเผา 3หัว, กระเทียมเผา 1หัว, พริกชี้ฟ้าเขียวแดงเผา 2เม็ด, น้ำปลาดี 1ชต., น้ำมะนาว 1ผล, น้ำตาลปี๊บ :: โขลกเนื้อปลากับหอมแดง กระเทียม พริกชี้ฟ้าเผาพอหยาบ | ตักใส่ถ้วย ปรุงรสด้วยน้ำตาลปี๊บ น้ำปลาดี น้ำมะนาว
น้ำพริกปลาช่อนย่าง สูตร 1 :: ปลา/ปลาร้า :: ปลาช่อนย่างแกะเนื้อ 700-800ก., พริกแห้งคั่ว 80ก., พริกขี้หนูแห้งคั่ว 20ก., หอมแดงเผา 100ก., กระเทียมเผา 60ก., ปลาร้าต้มกรองน้ำ 60ก., น้ำตาลปี๊บ 2-3ชต., น้ำมะนาว 5-6ชต., น้ำปลา 3-4ชต. :: โขลกหอม กระเทียมเผา กับพริกแห้งคั่วและเนื้อปลาให้เข้ากัน | เติมน้ำปลาร้าต้มกรอง ปรุงรสด้วยน้ำมะนาว น้ำปลา น้ำตาลให้กลมกล่อม
น้ำพริกปลาช่อนย่าง สูตร 2 :: ปลา/ปลาร้า :: ปลาช่อนย่าง 1ตัว, พริกแห้งคั่ว 8-10เม็ด, พริกขี้หนูแห้งคั่ว 6-10เม็ด, หอมแดงเผา 5หัว, กระเทียมเผา 3หัว, กะปิเผา, น้ำปลาร้าต้ม 1/4ถ้วย, น้ำตาล 1ชช., น้ำปลา 1-2ชต., มะนาว 2ชต. :: โขลกพริก หอม กระเทียม กะปิเผาให้ละเอียด แกะเนื้อปลาช่อนใส่โขลกด้วย | ปรุงรสด้วยน้ำตาล น้ำปลา มะนาว เติมน้ำปลาร้าต้มคนให้เข้ากัน
น้ำพริกปลาช่อนแห้ง :: ปลา/ปลาร้า :: ปลาช่อนแห้งปิ้งแกะเนื้อ 1ถ้วย, พริกแห้งเม็ดใหญ่แช่น้ำ 10เม็ด, กระเทียม 1หัว, กะปิดีเผา 2ชต., น้ำปลาดี น้ำตาลปี๊บ น้ำส้มมะขามเปียก น้ำมะนาว, น้ำมันพืช :: โขลกพริกแห้ง กระเทียม กะปิเผา และเนื้อปลาช่อนแห้งให้ละเอียด ปรุงรส | ผัดกับน้ำมันพืชเล็กน้อยจนแห้งร่วน
น้ำพริกปลาดุกฟู สูตร 1 :: ปลา/ปลาร้า :: ปลาดุกทอดฟู 500ก., พริกแห้งเม็ดใหญ่คั่ว 70-80ก., หอมแดงเผา 100-120ก., กระเทียมเผา 60-70ก., ข่าหั่นแว่นคั่ว 3ชต., มะขามเปียกสับละเอียด 60-70ก., เกลือป่น 2-4ชต. :: โขลกพริก หอม กระเทียม ข่าคั่ว เกลือ มะขามสับให้ละเอียด | ใส่ปลาดุกฟูใช้สากคนเคล้าให้เข้ากัน แต่งรสด้วยน้ำตาลเล็กน้อย
น้ำพริกปลาดุกฟู สูตร 2 :: ปลา/ปลาร้า :: ปลาดุกนึ่งทอดฟู 1ถ้วย, พริกแห้งเม็ดใหญ่เผา 10เม็ด, หอมแดงเผา 10หัว, กระเทียมเผา 5หัว, ข่าหั่นละเอียดคั่ว 1ชต., มะขามเปียกสับ 1/4ถ้วย, เกลือ 1ชต. :: โขลกพริก หอม กระเทียม ข่า เกลือ และมะขามเปียกสับให้ละเอียด | ใส่เนื้อปลาดุกฟูเคล้าจนเข้ากัน
น้ำพริกปลาดุกฟูแมงดา สูตร 1 :: ปลา/ปลาร้า :: ปลาดุกทอดฟู 500ก., พริกชี้ฟ้าเผา 100-120ก., หอมแดงเผา 80-100ก., กระเทียมเผา 60-70ก., น้ำมะนาว 6-8ชต., น้ำปลา 4-6ชต., น้ำตาลทราย 1-2ชต., แมงดา 3-4ตัว :: โขลกหอมแดง กระเทียม พริกชี้ฟ้าเผาพอละเอียด ใส่แมงดาฉีกและปลาดุกฟูโขลกเบาๆ | ปรุงรสด้วยน้ำมะนาว น้ำปลา น้ำตาลทราย
น้ำพริกปลาดุกฟูแมงดา สูตร 2 :: ปลา/ปลาร้า :: ปลาดุกฟู 1/2ถ้วย, พริกชี้ฟ้าเผา 10เม็ด, หอมแดงเผา 7หัว, กระเทียมเผา 4หัว, ระกำซอย 2ชต., น้ำตาล 1/2ชช., น้ำปลา 2-3ชต., แมงดาหอม 1-2ตัว :: โขลกพริก หอม กระเทียมเผา ใส่เนื้อปลาดุกฟูและแมงดาฉีกโขลกรวมกัน | ปรุงรสด้วยน้ำตาล น้ำปลา ระกำซอย (หรือมะนาว)
น้ำพริกปลาต้ม :: ปลา/ปลาร้า :: เนื้อปลา 500ก., พริกชี้ฟ้าเผา 100ก., หอมแดงเผา 100ก., กระเทียมเผา 60ก., ปลาร้า 60ก., น้ำมะนาว 5-6ชต., เกลือ 1-2ชต., น้ำตาล 2-3ชต., ต้นหอม ผักชีซอย 3-4ชต. :: ต้มปลากับปลาร้าจนสุก แกะเอาแต่เนื้อ กรองน้ำต้มปลาร้าไว้ | โขลกพริก หอม กระเทียมเผา ใส่เนื้อปลา เติมน้ำปลาร้าต้ม ปรุงรส โรยต้นหอมผักชี
น้ำพริกปลาทู :: ปลา/ปลาร้า :: ปลาทูย่างแกะเนื้อ 500ก., หอมแดงเผา 100ก., กระเทียมเผา 60ก., พริกชี้ฟ้าเผา 100ก., น้ำมะนาว 5-6ชต., น้ำปลา 3-4ชต., น้ำตาล 2-3ชต. :: โขลกหอม กระเทียม พริกชี้ฟ้าเผา ใส่เนื้อปลาทูย่างโขลกให้เข้ากัน | ปรุงรสด้วยน้ำมะนาว น้ำปลา น้ำตาล
น้ำพริกปลาทูเค็ม :: ปลา/ปลาร้า :: ปลาทูเค็มปิ้งแกะเนื้อ 2ตัว, พริกขี้หนูสวนหั่นละเอียด 15เม็ด, หอมแดงซอย 5หัว, น้ำปลาดี 2ชช., น้ำมะนาว 1ผล :: ยีเนื้อปลาทูเค็มปิ้งให้ละเอียด | เติมน้ำปลาดี น้ำมะนาว หอมแดงซอย พริกขี้หนูสวน คลุกเคล้าให้เข้ากัน
น้ำพริกปลาทูทอด :: ปลา/ปลาร้า :: ปลาทูทอดแกะเนื้อ 2ตัว, หอมเผา 5-7หัว, กระเทียมเผา 2หัว, พริกชี้ฟ้าเผา 6-8เม็ด, น้ำปลา 2-3ชต., น้ำตาล 1ชช., น้ำมะนาว 2-3ชต., น้ำสุก 2-3ชต. :: โขลกพริกชี้ฟ้า หอม กระเทียมเผา ใส่เนื้อปลาทูทอดโขลกรวมกัน | ปรุงรสด้วยน้ำตาล น้ำมะนาว น้ำปลา และน้ำต้มสุก
น้ำพริกปลาป่น สูตร 1 :: ปลา/ปลาร้า :: ปลาย่างกรอบป่น 500ก., หอมแดงเผา 150ก., กระเทียมเผา 80ก., พริกชี้ฟ้าแห้งคั่ว 80ก., พริกขี้หนูแห้งคั่ว 30ก., น้ำปลา 4-5ชต., น้ำมะนาว 5-6ชต., น้ำตาลทราย 2-3ชต., เกลือป่น 1ชต. :: โขลกหอม กระเทียมเผา กับพริกแห้งคั่วและเนื้อปลาป่นจนเข้ากันดี | ปรุงรสด้วยน้ำมะนาว น้ำปลา เกลือ น้ำตาลให้กลมกล่อม
น้ำพริกปลาป่น สูตร 2 :: ปลา/ปลาร้า :: ปลาสลาดแห้งย่าง 1ตัว, หอมแดงเผา 8หัว, พริกขี้หนูแห้งเผา 10เม็ด, พริกแห้งเผา 8เม็ด, กระเทียมเผา 5-6หัว, น้ำปลา 2ชต., น้ำตาล 1ชช., น้ำมะนาว 2-3ชต., เกลือ 1ชช. :: ย่างปลาสลาดให้กรอบแกะเนื้อโขลกละเอียด | โขลกพริกเผา หอม กระเทียมเผา ใส่ปลาคลุกเคล้า ปรุงรส
น้ำพริกปลาย่าง สูตร 1 :: ปลา/ปลาร้า :: ปลาย่างแกะเนื้อทอด 500ก., พริกชี้ฟ้าแห้งคั่ว 100ก., หอมแดงเผา 150ก., กระเทียมเผา 80ก., มะขามเปียกสับ 100ก., เกลือป่น 3-4ชต. :: โขลกพริก หอม กระเทียม มะขามเปียกสับ และเกลือให้เข้ากัน | ใส่เนื้อปลาย่างทอดโขลกอีกครั้งจนเข้ากันดี
น้ำพริกปลาย่าง สูตร 2 :: ปลา/ปลาร้า :: มะขามเปียกสับ 100ก., กะปิเผา 30ก., พริกแห้งแช่น้ำซอย 70ก., กระเทียม 50ก., ปลาย่างลนไฟแกะเนื้อ 500ก., น้ำปลา 4-6ชต., น้ำตาลปี๊บ 2-3ชต. :: โขลกเนื้อปลาย่าง พริก กระเทียม กะปิ และมะขามเปียกสับให้เข้ากัน | ปรุงรสด้วยน้ำปลา น้ำตาลปี๊บ
น้ำพริกปลาย่างมะขามเปียก สูตร 1 :: ปลา/ปลาร้า :: ปลาช่อนย่างแกะเนื้อทอด 1ถ้วย, พริกแห้งเผา 15เม็ด, หอมแดงเผา 10หัว, กระเทียมเผา 5หัว, เกลือ 2ชต., เนื้อมะขามเปียกสับ 2ชต. :: โขลกพริกแห้ง หอม กระเทียม เกลือ และมะขามเปียกให้ละเอียด | ใส่ปลาย่างทอดโขลกให้เข้ากัน
น้ำพริกปลาย่างมะขามเปียก สูตร 2 :: ปลา/ปลาร้า :: ปลาย่างแห้งแกะเนื้อ 3-4ชต., กะปิ 1ชช., พริกแห้งแช่น้ำ 4-5เม็ด, กระเทียม 2หัว, น้ำปลา 2ชต., น้ำตาลปี๊บ 1ชต., ส้มมะขามเปียกสับ 1ถ้วย :: โขลกพริกแห้ง กระเทียม ปลาย่าง กะปิให้ละเอียด | คลุกกับส้มมะขามเปียกสับ ปรุงรสด้วยน้ำตาล น้ำปลา
น้ำพริกปลายี่สน :: ปลา/ปลาร้า :: ปลายี่สนแกะเนื้อ 5ชต., น้ำปลาดี 3ชต., น้ำมะนาว 1ผล, หอมแดงซอย 2ชต., พริกขี้หนูสวนซอย 15เม็ด, พริกขี้หนูแห้งคั่วป่น 1ชช. :: โขลกปลายี่สนพอหยาบ ตักใส่จาน | ผสมเครื่องปรุงทั้งหมดคลุกเคล้าให้เข้ากัน
น้ำพริกปลาร้า สูตร 1 :: ปลา/ปลาร้า :: ปลาดุกอุย 1ตัว, พริกขี้หนูเผา 10เม็ด, หอมแดงเผา 5หัว, กระเทียมเผา 1หัว, น้ำปลาร้า 1ถ้วย, น้ำมะนาว 3ชต. :: ต้มปลาดุกในน้ำปลาร้าจนสุก แกะเอาแต่เนื้อ | โขลกหอม กระเทียม พริก เนื้อปลา เติมน้ำปลาร้าต้ม บีบมะนาว
น้ำพริกปลาร้า สูตร 2 :: ปลา/ปลาร้า :: ปลาร้าต้มกรองน้ำ 3ชต., ปลาทูย่างแกะเนื้อ 2ตัว, พริกชี้ฟ้าเผา 5เม็ด, กระเทียมเผา 1หัว, หอมแดงเผา 5ลูก, น้ำปลาดี 2ชช., ข่าเผา 2แว่น, มะนาว :: โขลกหอมแดง กระเทียม ข่า พริกชี้ฟ้าเผาพอหยาบ ใส่เนื้อปลาทูโขลกหยาบ | ผสมน้ำปลาร้าต้ม ปรุงรสด้วยน้ำมะนาว น้ำปลาดี
น้ำพริกปลาร้าทรงเครื่อง :: ปลา/ปลาร้า :: ปลาร้าต้มกรองน้ำ 200ก., ปลาช่อนหรือปลาทูต้มแกะเนื้อ 500ก., หอมแดงเผา 100ก., กระเทียมเผา 60ก., พริกขี้หนูคั่ว 20ก., พริกชี้ฟ้าคั่ว 100ก., น้ำมะนาว 5-6ชต., ผักชีเด็ดใบ :: โขลกหอม กระเทียมเผา พริกคั่ว และเนื้อปลาต้มเข้าด้วยกัน | เติมน้ำปลาร้าต้ม ปรุงรสด้วยน้ำมะนาว โรยใบผักชี
น้ำพริกปลาร้าสับ :: ปลา/ปลาร้า :: ปลาร้าสับ 1/2ถ้วย, ตะไคร้ ใบมะกรูด หอมแดง กระเทียมซอยฝอย, พริกขี้หนู พริกชี้ฟ้าแดงหั่น, ไข่ไก่ 1-2ฟอง, มะนาว 1-2ลูก, น้ำมันพืช :: เคล้าปลาร้าสับกับสมุนไพรซอย พริก และไข่ให้เข้ากัน | นำลงผัดไฟอ่อนจนสุก ปรุงรสด้วยน้ำมะนาว
น้ำพริกปลาสลาดป่น :: ปลา/ปลาร้า :: ปลาสลาดแห้งย่างโขลกละเอียด 1ถ้วย, พริกแห้งคั่ว 200ก., กระเทียมคั่วซอย 1/2ถ้วย, เกลือ 1ชต., น้ำตาล 1ชต., กะปิเผา 1ชต. :: โขลกปลาสลาด พริกแห้ง กระเทียม เกลือ น้ำตาล กะปิเผาให้เข้ากันดี
น้ำพริกปีกุนกับประกา :: หมู/ไก่/เนื้อ :: เนื้อหมูและไก่สับรวมกัน 2/3ถ้วย, พริกขี้หนูสด 12เม็ด, กะปิดีเผา 1ชต., กระเทียม 1.5หัว, น้ำมะนาว 2.5ชต., น้ำตาลปี๊บ 4ชช., น้ำปลาดี 1/2ชต. :: โขลกกะปิ กระเทียม พริกขี้หนูให้ละเอียด รวนหมูไก่สับในกระทะพอสุกนิ่ม | นำหมูไก่รวนลงเคล้าในครก ปรุงรสสามรส เหยาะน้ำรวนเล็กน้อย
น้ำพริกปู / น้ำพริกไข่ปู :: กุ้ง/ปู :: เนื้อปูนึ่ง 500ก., ไข่ปู 200ก., พริกขี้หนูสวน 70ก., กระเทียม 100ก., น้ำมะนาว 6-7ชต., น้ำปลา 4-5ชต., น้ำตาลปี๊บ 2-3ชต. :: คั่วกระเทียม พริกขี้หนูในน้ำมันพอสุก ซับน้ำมันออกแล้วโขลกพอละเอียด | คลุกเคล้าเนื้อปูและไข่ปูนึ่ง ปรุงรสสามรส
น้ำพริกปูเค็ม สูตร 1 :: กุ้ง/ปู :: ปูเค็มแกะ 5ตัว, พริกขี้หนูสด 15เม็ด, กระเทียม 1หัว, หอมแดงหั่นซอย 3ชต., น้ำตาลปี๊บ 1ชต., น้ำปลาดี 1ชต. :: โขลกกระเทียม หอมแดง พริกขี้หนูพอหยาบ | ใส่ปูเค็มโขลกให้เข้ากัน ปรุงรสด้วยน้ำตาลปี๊บและน้ำปลา
น้ำพริกปูเค็ม สูตร 2 :: กุ้ง/ปู :: กุ้งแห้งป่น 120-150ก., มะขามอ่อนสด 200ก., ปูเค็มลวก 300ก., พริกขี้หนูสวน 50-60ก., กระเทียมซอย 50-60ก., กะปิเผา 50ก., น้ำปลา 3-4ชต., น้ำตาลปี๊บ 3-4ชต., น้ำมะนาว 8-10ชต. :: โขลกพริก กระเทียม กะปิ มะขามอ่อนสด และกุ้งแห้งป่นให้เข้ากัน ปรุงรสสามรส | แกะปูเค็มฉีกก้ามและขาปูลงคนคลุกเคล้าให้เข้ากัน
น้ำพริกปูม้า :: กุ้ง/ปู :: เนื้อปูม้าสด 5ชต., กะปิดีเผา 1ชต., พริกขี้หนูสวน 15เม็ด, กระเทียม 1หัว, มะอึกขูดขนหั่นละเอียด 1ลูก, มะเขือพวง 10เม็ด, น้ำตาลปี๊บ น้ำมะนาว น้ำปลาดี :: โขลกกะปิเผา กระเทียม พริกขี้หนู มะอึก เนื้อปูม้าสดให้ละเอียด | ใส่มะเขือพวงบุบพอแตก ปรุงรสสามรส
น้ำพริกผักชี สูตร 1 :: กุ้ง/ปู :: กะปิดีเผา, กุ้งสดเผาแกะเปลือก 10ตัว, กระเทียม, พริกขี้หนูเขียวแดง, รากผักชีโขลก 2ชช., น้ำตาลปึก, น้ำปลา, น้ำมะนาว, น้ำสุก, ผักชีหั่นหยาบ :: โขลกกระเทียม กะปิ พริกขี้หนู รากผักชี และเนื้อกุ้งเผาให้ละเอียด | ปรุงรสสามรส เติมน้ำสุก ใส่ผักชีหั่นหยาบผสมเบาๆ
น้ำพริกผักชี สูตร 2 :: กุ้ง/ปู :: ผักชีหั่นฝอย 100ก., กุ้งนางเผาแกะเนื้อพร้อมมันกุ้ง 500ก., พริกขี้หนูสวนนึ่ง 50ก., กระเทียมนึ่ง 60-70ก., รากผักชีซอย 2ชต., กะปิเผา 4ชต., น้ำปลา 3-4ชต., น้ำตาล 2-3ชต., น้ำมะนาว 6-7ชต. :: โขลกพริก กระเทียมนึ่ง กะปิเผา รากผักชี เนื้อกุ้งและมันกุ้งให้เข้ากัน | ใส่ผักชีหั่นฝอยโขลกเบาๆ ปรุงรสสามรส
น้ำพริกผักชีมะเขือเผา :: ปลา/ปลาร้า :: ผักชีต้นใหญ่ 1ต้น, พริกชี้ฟ้าแดง 9เม็ด, น้ำปลาดี 2ชต., น้ำตาลปี๊บ 1ชช., กะปิดีเผา 1ชต., กระเทียม 4หัว, หอมแดง 5หัว, มะเขือยาวเผา 1ผล, ปลาป่น 5ชต., ต้นหอมซอย, มะนาว :: โขลกพริก หอม กระเทียม กะปิเผา ปลาป่น และเนื้อมะเขือยาวเผาให้เข้ากัน | ปรุงรสสามรส โรยต้นหอมและผักชีซอย
น้ำพริกผักต้มกะทิ :: กุ้ง/ปู :: มะพร้าวขูด 300ก., กุ้งแห้งป่น 300ก., พริกขี้หนูสวน 50ก., กระเทียม 100ก., กะปิเผา 50ก., มะอึกหรือระกำซอย 100ก., น้ำปลา 5-6ชต., น้ำตาล 3-4ชต., น้ำมะนาว 5-6ชต. :: โขลกกุ้งแห้ง กระเทียม พริกขี้หนู กะปิเผา ใส่มะอึกหรือระกำซอย ปรุงรสสามรส | คั้นกะทิแยกหัวและหาง หางกะทิใช้ต้มผัก ส่วนหัวกะทิหยอดราดหน้าผัก
น้ำพริกผัดน้ำมัน :: กุ้ง/ปู :: พริกแห้งเม็ดใหญ่ 15เม็ด, กระเทียม 3หัว, กุ้งแห้งป่น 1/2ถ้วย, น้ำมันพืช 5ชต., น้ำตาลปี๊บ น้ำปลาดี น้ำส้มมะขามเปียก :: โขลกพริกแห้ง กระเทียมให้ละเอียด นำลงผัดน้ำมันจนหอม | ใส่กุ้งแห้งป่นและเครื่องปรุงรสสามรส ผัดต่อจนแห้งร่วน
น้ำพริกผัดพริกขิง :: หมู/ไก่/เนื้อ :: พริกแห้งเม็ดใหญ่แช่น้ำ 10-15เม็ด, กากหมูเจียว 1ถ้วย, เกลือ 1/2ชช., หอมแดง 10หัว, กระเทียม 5หัว, กุ้งแห้งโขลกหยาบ 100ก., น้ำปลา 1-2ชต., น้ำตาลปี๊บ 1ชช., น้ำมันพืช 1/4ถ้วย :: โขลกพริก หอม กระเทียม เกลือ กุ้งแห้ง และกากหมูบางส่วนจนนวล | นำลงผัดไฟอ่อนจนแห้ง ใส่กากหมูที่เหลือ ปรุงรสด้วยน้ำปลา น้ำตาล
น้ำพริกผิวมะนาว :: กุ้ง/ปู :: ผิวมะนาว 1ลูก, กุ้งแห้ง 1/4ถ้วย, หอมแดง 2หัว, กระเทียม 1หัว, พริกขี้หนู 15-20เม็ด, กะปิ 2ชต., น้ำตาลปี๊บ 1-2ชช., น้ำมะนาว 2ชต. :: โขลกผิวมะนาวให้ละเอียด ใส่กุ้งแห้ง หอมแดง กระเทียม พริกขี้หนู กะปิ และเครื่องปรุงรสโขลกให้เข้ากัน
น้ำพริกเผา สูตร 1 :: กุ้ง/ปู :: พริกแห้งเม็ดใหญ่ปิ้ง 15เม็ด, กระเทียมเจียว 3หัว, หอมแดงเจียว 10หัว, น้ำตาลปี๊บ 3ชต., น้ำมะขามเปียก 3ชต., กุ้งแห้งป่น 1ถ้วย, เกลือป่น 1.5ชช., น้ำมันพืช 5ชช. :: โขลกกุ้งแห้ง พริกแห้ง หอมเจียว กระเทียมเจียวให้ละเอียด | นำลงผัดในกระทะ เติมน้ำส้มมะขามเปียก น้ำตาล เกลือ คลุกเคล้าให้เข้ากัน
น้ำพริกเผา สูตร 2 :: กุ้ง/ปู :: กุ้งแห้งทอด 1ถ้วย, กะปิเผา 2ชต., หอมแดงเจียว 1ถ้วย, กระเทียมเจียว 1ถ้วย, พริกแห้งเม็ดใหญ่เจียว 12-15เม็ด, น้ำตาลปี๊บ 1/3ถ้วย, น้ำปลา 1/3ถ้วย, น้ำส้มมะขามเปียก 4ชต., น้ำมัน 1/2ถ้วย :: โขลกกุ้งแห้ง หอม กระเทียม พริกทอดให้ละเอียด ผสมกะปิเผา | ผัดไฟอ่อนในกระทะ ใส่น้ำตาล น้ำปลา น้ำส้มมะขาม คนจนข้นได้ที่
น้ำพริกเผา สูตร 3 :: กุ้ง/ปู :: กุ้งแห้งคั่ว 500ก., พริกแห้งใหญ่ทอด 80-100ก., หอมแดงคั่ว 100-120ก., กระเทียมคั่ว 70-80ก., กะปิเผา 60-80ก., น้ำมะขามเปียก 7-8ก., น้ำตาลปี๊บ 2-4ชต., น้ำปลา 3-5ชต. :: โขลกกุ้งแห้ง หอม กระเทียมคั่ว กะปิเผา และพริกทอดให้เข้ากัน | ปรุงรสด้วยน้ำมะขาม น้ำปลา น้ำตาล นำไปผัดน้ำมันพอสุกเป็นเนื้อเดียวกัน
น้ำพริกเผากุ้งแห้งป่น :: กุ้ง/ปู :: พริกแห้งเม็ดใหญ่เผา 9เม็ด, กุ้งแห้งป่น 2ชต., หอมแดงเผา 4หัว, กระเทียมเผา 4หัว, น้ำตาลปี๊บ 1ชต., น้ำปลาดี 1ชต., น้ำมันพืช 2.5ชต., กุ้งแห้งเป็นตัว 2ชต. :: โขลกพริก หอม กระเทียมเผา และกุ้งแห้งป่นให้ละเอียด | นำลงผัดน้ำมันไฟอ่อน ปรุงรสด้วยน้ำปลา น้ำตาล คลุกกุ้งแห้งเป็นตัว
น้ำพริกเผาไก่ :: หมู/ไก่/เนื้อ :: เนื้อไก่นึ่งสับ 1ถ้วย, พริกแห้งทอด 10เม็ด, กระเทียมเจียว 1/4ถ้วย, หอมเจียว 1/4ถ้วย, น้ำปลา 2ชต., เกลือ 1ชช., น้ำส้มมะขามเปียก 1/4ถ้วย, น้ำตาลปี๊บ 1/4ถ้วย, น้ำมัน 1/4ถ้วย :: โขลกพริก กระเทียม หอม เกลือ และเนื้อไก่นึ่งให้เข้ากัน | ผสมน้ำตาลปี๊บ น้ำส้มมะขามเปียก นำลงผัดไฟอ่อนจนหอม
น้ำพริกเผาถั่วเขียวงา :: ผัก/ผลไม้ :: ถั่วเขียวเลาะเปลือกนึ่งโขลก 3/4ถ้วย, หอมเจียว 3/4ถ้วย, กระเทียมเจียว 1/2ถ้วย, พริกแห้งทอด 10-15เม็ด, น้ำตาลปี๊บ 1/3ถ้วย, ซีอิ๊วขาว 1/3ถ้วย, น้ำส้มมะขามเปียก 1/4ถ้วย, น้ำมันพืช 1/4ถ้วย, งาคั่ว :: โขลกหอมเจียว กระเทียมเจียว และพริกทอดให้ละเอียด นำลงผัดน้ำมันไฟอ่อน | ใส่น้ำตาล ซีอิ๊วขาว น้ำส้มมะขามเปียก ถั่วเขียว และงาคั่ว คนให้เข้ากันจนเดือด
น้ำพริกเผาทรงเครื่อง :: หมู/ไก่/เนื้อ :: หมูสับทอด 200ก., กุ้งแห้งทอด 150ก., ถั่วลิสงบดทอด 200ก., พริกแห้งคั่ว 60-70ก., กระเทียมคั่ว 100ก., ข่าคั่ว 10ก., กะปิเผา 30ก., กระเทียมเจียว 20ก., น้ำปลา 4-5ชต., น้ำตาล 3-4ชต., น้ำมะขามเปียก 5-6ชต. :: โขลกพริก กระเทียม ข่าคั่ว และกะปิเผาให้ละเอียด | เคี่ยวน้ำปลา น้ำมะขามเปียก น้ำตาลจนเดือด ใส่น้ำพริก ถั่วลิสง กุ้งแห้ง และหมูสับคนให้เข้ากัน
น้ำพริกพม่า :: กุ้ง/ปู :: เกลือ 1ชช., กุ้งแห้งป่น 1/2ถ้วย, พริกขี้หนูคั่วป่น 1ชต., กะปิ 1ชต., น้ำมันหมู 1/4ถ้วย, น้ำมะขามเปียก 2ชต. :: โขลกเกลือ กุ้งแห้ง พริกขี้หนู กะปิเข้าด้วยกัน | นำลงผัดด้วยน้ำมันหมู ปรุงรสด้วยน้ำส้มมะขามเปียก
น้ำพริกพริกแห้ง :: กุ้ง/ปู :: กะปิดีเผา 1ชต., กระเทียม 1หัว, พริกขี้หนูแห้ง 15เม็ด, น้ำมะนาว 1ผล, น้ำปลาดี น้ำตาลปี๊บ :: โขลกกะปิเผา กระเทียม พริกขี้หนูแห้งให้ละเอียด | ตักใส่ถ้วย ปรุงรสด้วยน้ำปลาดี น้ำตาลปี๊บ น้ำมะนาว คลุกเคล้าให้เข้ากัน
น้ำพริกภูเก็ต (น้ำพริกโจร) :: กุ้ง/ปู :: กุ้งนางหรือกุ้งทะเลเผา 500ก., พริกขี้หนูสวนคั่ว 70-80ก., หอมแดงซอยหยาบ 100-120ก., น้ำมะนาว 7-9ชต., น้ำปลา 4-6ชต., น้ำตาลปี๊บ 2-4ชต., กะปิเผา 60-80ก. :: โขลกกะปิเผากับพริกขี้หนูคั่วเบาๆ ใส่หอมแดงซอย | ใส่เนื้อกุ้งหั่นชิ้นและมันกุ้งคลุกเคล้า ปรุงรสสามรส
น้ำพริกมะกรูด :: ปลา/ปลาร้า :: น้ำมะกรูด 15-18ชต., ปลากรอบป่น 200ก., พริกขี้หนูสวนนึ่ง 60-70ก., กระเทียมนึ่ง 60-70ก., กะปิเผา 50ก., น้ำปลา 5-6ชต., น้ำตาลปี๊บ 2-4ชต. :: โขลกพริก กระเทียมนึ่ง กะปิเผา และปลาย่างป่นให้เข้ากัน | ปรุงรสด้วยน้ำมะกรูด น้ำปลา น้ำตาลให้กลมกล่อม
น้ำพริกมะกอกกุ้งฝอย :: กุ้ง/ปู :: มะกอกไทยสุกหั่นทั้งเปลือก 300ก., กุ้งฝอยต้มเกลือ 300ก., พริกชี้ฟ้าปิ้ง 100-120ก., หอมแดง 100ก., กระเทียม 60-70ก., ต้นหอมซอย, ผักชีซอย, น้ำปลา 5-6ชต. :: โขลกหอม กระเทียม พริกชี้ฟ้าเผา และกุ้งฝอยต้มให้ละเอียด | ใส่เนื้อมะกอกสับคลุกให้เข้ากัน ปรุงรสด้วยน้ำปลา โรยต้นหอมผักชี
น้ำพริกมะขามเปียก สูตร 1 :: ผัก/ผลไม้ :: ส้มมะขามเปียกหั่นละเอียด 1ชต., พริกขี้หนูสวน 15เม็ด, กระเทียม 2หัว, หอมแดง 2หัว, กะปิดีเผา 1ชต., มะเขือขื่นแคะเม็ดหั่นละเอียด 1ผล, น้ำตาลปี๊บ 1ชต., น้ำปลาดี 2ชช. :: โขลกพริกขี้หนู กระเทียม หอมแดง ส้มมะขามเปียก กะปิเผาให้เข้ากัน | ใส่มะเขือขื่นคลุกเคล้า ปรุงรสด้วยน้ำตาลปี๊บ น้ำปลาดี
น้ำพริกมะขามเปียก สูตร 2 :: กุ้ง/ปู :: พริกแห้งแช่น้ำ 3เม็ด, กระเทียม 10กลีบ, กุ้งแห้ง 2ชต., กะปิ 1ชช., น้ำปลา 1ชต., น้ำตาลปี๊บ 1ชต., ส้มมะขามเปียกสับละเอียด 1ถ้วย :: โขลกพริกแห้ง กระเทียม กุ้งแห้ง กะปิให้ละเอียด | ใส่ส้มมะขามเปียกสับคลุกเคล้า ปรุงรสด้วยน้ำตาล น้ำปลา
น้ำพริกมะขามเปียก สูตร 3 :: ปลา/ปลาร้า :: มะขามเปียกสับละเอียด 300ก., ปลากรอบหรือกุ้งแห้งตำป่น 300ก., พริกชี้ฟ้าแห้งคั่ว 30เม็ด, หอมแดงคั่ว 20หัว, กระเทียมคั่ว 50กลีบ, พริกขี้หนูสวน 50เม็ด, น้ำตาลปี๊บ 80-100ก., น้ำปลา 5-6ชต., กะปิเผา 3ชต. :: โขลกพริกแห้ง ปลากรอบ กระเทียม หอม กะปิเผา และพริกขี้หนูให้เข้ากัน | ใส่มะขามเปียกสับ ปรุงรสด้วยน้ำปลา น้ำตาล
น้ำพริกมะขามสด :: หมู/ไก่/เนื้อ :: กะปิเผา 2ชต., กระเทียม 1ชต.พูน, พริกขี้หนู 1ชต., กุ้งแห้งป่น 2ชต., มะขามสดขูดผิวหั่นเล็ก 1/4ถ้วย, น้ำตาลปี๊บ 3ชต., น้ำปลา 1ชต., เนื้อหมูสับ 1/4ถ้วย, น้ำมัน 2-3ชต. :: โขลกกะปิ กระเทียม พริกขี้หนู มะขามสด กุ้งแห้งป่น ปรุงรสและเคล้าหมูสับ | นำลงผัดน้ำมันไฟอ่อนจนหมูสุกและน้ำพริกแห้ง
น้ำพริกมะขามสดปูเค็ม :: กุ้ง/ปู :: มะขามสดอ่อน 10ฝัก, กระเทียม 1ชต., หอมแดง 1หัว, กะปิ 2ชต., กุ้งแห้งป่น 2ชต., น้ำตาลปี๊บ 2ชช., ปูเค็มลวก 2ตัว, พริกขี้หนู :: โขลกกะปิ กระเทียม หัวหอม มะขามสด และพริกขี้หนูให้ละเอียด | เติมกุ้งแห้งป่น น้ำตาลปี๊บ และปูเค็มหั่นชิ้นคลุกให้เข้ากัน
น้ำพริกมะขามอ่อน :: ปลา/ปลาร้า :: มะขามอ่อนสด 2ขีด, กระเทียม 2หัว, หัวหอมแดง 5หัว, กะปิดี 2ชต., พริกขี้หนูสวน 50เม็ด, เนื้อปลาทูย่างแกะ 3ชต., น้ำปลาดี 2ชต., น้ำมันพืช 5ชต., น้ำตาลปี๊บ :: โขลกกะปิ กระเทียม หอมแดง มะขามอ่อน พริกขี้หนู และเนื้อปลาทูย่างให้เข้ากัน ปรุงรส | นำลงผัดน้ำมันไฟอ่อนให้หอม
น้ำพริกมะเขือเทศ :: กุ้ง/ปู :: มะเขือเทศย่าง 1ถ้วย, กุ้งแห้งป่น 1/4ถ้วย, กะปิเผา 1ชช., หอมแดงเผา 3-4หัว, กระเทียมเผา 1-2หัว, น้ำตาล 1-2ชต., น้ำปลา 2ชต., น้ำมะนาว 2ชต., พริกชี้ฟ้าเผา 3-5เม็ด :: โขลกหอม กระเทียม กะปิ พริกชี้ฟ้าเผาให้ละเอียด | ใส่กุ้งแห้งและมะเขือเทศย่างโขลกให้เข้ากัน ปรุงรสสามรส
น้ำพริกมะเขือเผา :: ผัก/ผลไม้ :: มะเขือยาวเผา 1ลูก, หอมแดงเผา 5หัว, กระเทียมเผา 1หัว, พริกชี้ฟ้าเผา 5-7เม็ด, น้ำปลา 3ชต., น้ำมะนาว 2ชต., งาคั่ว :: โขลกพริก หอม กระเทียมเผาให้ละเอียด | ใส่มะเขือยาวเผาลอกเปลือกหั่นท่อนโขลกรวมกัน ปรุงรส โรยงาคั่ว
น้ำพริกมะเขือพวง สูตร 1 :: ปลา/ปลาร้า :: มะเขือพวงย่าง 25เม็ด, กะปิดีเผา 1ชช., พริกชี้ฟ้าเผา 10เม็ด, เนื้อปลาทูย่าง 2ตัว, มะดันซอย 2ชต., กระเทียม 2ชต., น้ำปลาดี น้ำตาลปี๊บ น้ำมะนาว :: โขลกเนื้อปลาทูย่าง กะปิเผา มะดันซอย พริกชี้ฟ้า กระเทียม มะเขือพวงพอหยาบ | ตักใส่ถ้วย ปรุงรสสามรส
น้ำพริกมะเขือพวง สูตร 2 :: ปลา/ปลาร้า :: มะเขือพวงเผา 300ก., ปลากรอบ 300ก., พริกชี้ฟ้าเผา 18-20เม็ด, พริกขี้หนูสวน 25-30เม็ด, กะปิเผา 4ชต., กระเทียม 20-25กลีบ, น้ำปลา 3-5ชต., น้ำตาล 2-3ชต., น้ำมะนาว 5-6ชต. :: โขลกเนื้อปลากรอบ กระเทียม พริกขี้หนูให้ละเอียด | ใส่มะเขือพวงเผาบุบพอแตก และพริกชี้ฟ้าเผาโขลกให้เข้ากัน ปรุงรสสามรส
น้ำพริกมะเขือยาว :: ไข่ :: มะเขือยาวเผา 2ลูก, พริกสดเผา 3เม็ด, หอมเผา 5หัว, กระเทียมเผา 1หัว, เกลือ 1ชช., ไข่ต้ม 1ฟอง, ใบสะระแหน่ 1/2ถ้วย, น้ำมันพืช 2ชต. :: โขลกพริก หอม กระเทียมเผา เกลือ และมะเขือยาวเผาให้เข้ากัน | นำลงผัดน้ำมันให้หอม คลุกไข่ต้มหั่นชิ้นเล็ก โรยใบสะระแหน่
น้ำพริกมะดันสด :: ปลา/ปลาร้า :: มะดันสด 10ผล, กะปิดีเผา 1ชต., กระเทียม 1หัว, พริกขี้หนูสวน 15เม็ด, มะอึกซอย 1ลูก, กุ้งแห้งป่น 1ชช., ปลากรอบป่น 2ชต., น้ำตาลปี๊บ น้ำปลาดี :: โขลกพริกขี้หนู กระเทียม เนื้อมะดันสด กุ้งแห้ง ปลากรอบ มะอึกให้ละเอียด | ปรุงรสด้วยน้ำตาล น้ำปลาดี
น้ำพริกมะดัน (ทรงเครื่อง) :: ปลา/ปลาร้า :: มะเขือเทศสุกเผา 200ก., กุ้งนางเผา 200ก., ปลาดุกหรือปลาช่อนย่างแกะเนื้อ 500ก., พริกชี้ฟ้าเผา 120ก., หอมแดง 150ก., กระเทียม 50ก., กะปิเผา 30ก., น้ำปลาร้าต้มกรอง 1/2ถ้วย, น้ำมะนาว 6-8ชต., น้ำตาลทราย 3-4ชต. :: โขลกพริก หอม กระเทียม กะปิเผา มันกุ้ง และปลาย่างพอหยาบ | คลุกเคล้ากับมะเขือเทศเผาหั่นเสี้ยว เนื้อกุ้งเผา น้ำปลาร้าต้ม ปรุงรส
น้ำพริกมะม่วง :: ผัก/ผลไม้ :: มะม่วงดิบเปรี้ยวสับ 2ถ้วย, กุ้งแห้งป่น 1/2ถ้วย, กะปิ 2ชต., หอมแดงหั่น 1/4ถ้วย, พริกชี้ฟ้า 6เม็ด, พริกขี้หนู 10เม็ด, น้ำปลา 1/4ถ้วย, น้ำตาลปี๊บ 1/4ถ้วย :: โขลกหอม พริกชี้ฟ้า กะปิ กุ้งแห้งป่นเข้าด้วยกัน | ใส่มะม่วงดิบสับคลุกเคล้า บุบพริกขี้หนู ปรุงรสด้วยน้ำตาล น้ำปลา
น้ำพริกมะม่วงเปรี้ยว :: ผัก/ผลไม้ :: มะม่วงดิบเปรี้ยวซอยละเอียด 1ผล, กุ้งแห้งป่น 1/2ถ้วย, พริกขี้หนูสวน 15เม็ด, กะปิดีเผา 1ชต., กระเทียม, น้ำปลา น้ำมะนาว น้ำตาลปี๊บ :: โขลกมะม่วงซอย พริกขี้หนู กระเทียม กะปิเผาพอหยาบ | ปรุงรสด้วยน้ำปลา น้ำมะนาว น้ำตาลปี๊บ เติมน้ำสุกเล็กน้อย
น้ำพริกมะม่วงแมงดา :: ปลา/ปลาร้า :: ปลากรอบป่น 2ถ้วย, กะปิเผา 1ชต., มะม่วงสับเส้นเล็ก 1/4ถ้วย, พริกแห้งแช่น้ำคั่ว 12-15เม็ด, แมงดาหอม 1ตัว, กระเทียมคั่ว 12หัว, หอมคั่ว 12หัว, เกลือ 1ชช., น้ำตาลปี๊บ 2-4ชต., น้ำปลา 4ชต., น้ำมัน 3ชต. :: โขลกพริกแห้ง เกลือ หอม กระเทียม กะปิ ใส่ปลากรอบ มะม่วงสับ แมงดาฉีก ปรุงรส | นำลงผัดน้ำมันไฟอ่อนจนทั่ว
น้ำพริกมะยม :: ผัก/ผลไม้ :: มะยมแกะเม็ด 500ก., กุ้งแห้งคั่วป่น 500ก., พริกขี้หนูสวน 100ก., กระเทียม 100-120ก., กะปิเผา 4ชต., น้ำปลา 4-5ชต., น้ำตาลปี๊บ 3-4ชต. :: โขลกเนื้อมะยมให้ละเอียด พักไว้ โขลกพริก กระเทียม กะปิให้เข้ากัน | ใส่เนื้อมะยมและกุ้งแห้งป่นโขลกเคล้าให้เข้ากัน ปรุงรสด้วยน้ำปลา น้ำตาล
น้ำพริกมันกุ้ง สูตร 1 :: กุ้ง/ปู :: กุ้งนางต้ม 5ตัว, พริกขี้หนูสด 20เม็ด, กระเทียม 15กลีบ, กะปิดีเผา 1ชต., มะอึกหั่นบาง 1ผล, น้ำปลาดี น้ำตาลปี๊บ น้ำมะนาว :: แยกมันกุ้งไว้ โขลกพริก กระเทียม กะปิเผา และเนื้อกุ้งให้ละเอียด | ใส่มะอึก ปรุงรสสามรส ราดหน้าด้วยมันกุ้ง
น้ำพริกมันกุ้ง สูตร 2 :: กุ้ง/ปู :: มันกุ้งนึ่ง 1ถ้วย, หอมซอยคั่ว 1/4ถ้วย, กระเทียมซอยคั่ว 1/4ถ้วย, พริกเหลืองคั่ว 8-10เม็ด, น้ำปลา 2ชต., กะปิเผา 1ชต., น้ำตาลปี๊บ 2ชช., เกลือ 1ชช., น้ำมะนาว :: โขลกพริก หอม กระเทียม กะปิ เกลือเข้าด้วยกัน | ใส่มันกุ้งนึ่งโขลกให้ทั่ว ปรุงรสด้วยน้ำปลา น้ำมะนาว น้ำตาล
น้ำพริกลูกหนำเลี้ยบ สูตร 1 :: กุ้ง/ปู :: ลูกหนำเลี้ยบแกะเนื้อ 1ลูก, กะปิดีเผา 1ชต., พริกขี้หนูสวน 15เม็ด, พริกชี้ฟ้าหั่นหนา 2เม็ด, กระเทียม 1หัว, น้ำปลาดี 2ชช., น้ำตาลปี๊บ 1ชช., น้ำมะนาว 1ผล :: โขลกกะปิ กระเทียม พริกขี้หนู เนื้อลูกหนำเลี้ยบให้ละเอียด | ใส่พริกชี้ฟ้าคลุกเคล้า ปรุงรสสามรส
น้ำพริกลูกหนำเลี้ยบ สูตร 2 :: หมู/ไก่/เนื้อ :: ลูกหนำเลี้ยบหั่น 1/2ถ้วย, เนื้อหมูสับ 1/2ถ้วย, กุ้งแห้งป่น 1/2ถ้วย, กากหมูเจียว 1/3ถ้วย, กระเทียมเจียว, พริกแห้ง พริกชี้ฟ้า พริกขี้หนู, กะปิ 1.5ชต., น้ำตาลปี๊บ 1/4ถ้วย, น้ำมะนาว 3ชต. :: ผัดพริกแกงกะปิให้หอม ใส่หมูสับ ลูกหนำเลี้ยบ กุ้งแห้งป่น น้ำตาลปี๊บ น้ำมะนาว ผัดให้แห้ง | ใส่กากหมูและโรยกระเทียมเจียว
น้ำพริกสลิด :: ปลา/ปลาร้า :: ปลาสลิดทอดแกะเนื้อ 1ถ้วย, พริกแห้งแช่น้ำ 10เม็ด, กระเทียม 3หัว, กะปิดีเผา 2ชต., น้ำปลาดี น้ำตาลปี๊บ น้ำส้มมะขามเปียก, น้ำมันพืช :: โขลกพริกแห้ง กะปิเผา กระเทียม ปลาสลิดทอดให้ละเอียด ปรุงรสสามรส | นำลงผัดน้ำมันไฟอ่อนจนแห้งร่วน
น้ำพริกสวรรค์ สูตร 1 :: กุ้ง/ปู :: กุ้งนางย่างแกะเนื้อฉีกฝอยพร้อมมันกุ้ง 5ตัว, น้ำตาลทราย 2ชช., น้ำมะนาว 3ชต., น้ำปลาดี 2ชต., กะปิดีเผา 1ชช., หอมแดง 9หัว, กระเทียม 4กลีบ, พริกชี้ฟ้า 4เม็ด, พริกเหลือง 3เม็ด, พริกขี้หนูซอย 1/2ชช. :: โขลกหอม กระเทียม กะปิเผา พริกเหลืองให้ละเอียด บุบพริกชี้ฟ้าและพริกขี้หนูพอแตก ปรุงรสสามรส | ใส่เนื้อกุ้งย่างฉีกและมันกุ้งคลุกเคล้าให้เข้ากัน
น้ำพริกสวรรค์ สูตร 2 :: ปลา/ปลาร้า :: ปลากรอบคั่วโขลกละเอียด 1/2ถ้วย, พริกแห้งทอด 10เม็ด, กระเทียมเจียว 1/4ถ้วย, หอมเจียว 1/4ถ้วย, น้ำตาลทราย 1/4ถ้วย, เกลือ 1ชต., น้ำมันพืช 1/4ถ้วย :: โขลกพริกทอด กระเทียมเจียว หอมเจียว น้ำตาล เกลือ และปลากรอบให้ละเอียด | นำลงผัดน้ำมันพอร้อนทั่ว
น้ำพริกสวรรค์ สูตร 3 :: ปลา/ปลาร้า :: ปลากรอบรมควันแกะเนื้อ 500ก., หอมแดงทอด 80-100ก., กระเทียมทอด 60-80ก., พริกแห้งใหญ่ทอด 100ก., น้ำตาลทราย 3-4ชต., เกลือป่น 2-3ชต. :: โขลกพริกทอด หอม กระเทียม และเนื้อปลากรอบให้ละเอียด | ปรุงรสด้วยน้ำตาล เกลือ ผัดน้ำมันเล็กน้อยพอหอม
น้ำพริกสองสหาย :: หมู/ไก่/เนื้อ :: เนื้อหมูสับลวก 2ขีด, กากหมูคั่ว 1ถ้วย, พริกชี้ฟ้าเผา 10เม็ด, หอมแดงเผา 5หัว, กระเทียมเผา 3หัว, มะดันซอยละเอียด 1ผล, น้ำปลา น้ำตาลปี๊บ น้ำมะนาว :: โขลกพริก หอม กระเทียมเผา และมะดันซอยให้ละเอียด ใส่กากหมูโขลกเบาๆ | ใส่หมูสับลวกคลุกเคล้า ปรุงรสสามรส
น้ำพริกสามมะ :: กุ้ง/ปู :: มะดันหั่นเฉียงบาง 12-15ลูก, มะอึกซอยบาง 18-20ลูก, มะขามเปียกสับ 50-60ก., กุ้งแห้งป่น 150ก., พริกชี้ฟ้า 100ก., พริกขี้หนู 30ก., กะปิเผา 50ก., กระเทียม 60ก., น้ำปลา 6-7ชต., น้ำตาล 3-4ชต., กากหมูเจียว :: โขลกมะขามเปียก พริก กระเทียม กะปิ กุ้งแห้งให้ละเอียด คลึงมะดันและมะอึกพอแหลก ปรุงรส | นำลงผัดน้ำมันจนหอม ใส่กากหมูผัดให้เข้ากัน
น้ำพริกเสวย สูตร 1 :: กุ้ง/ปู :: กุ้งแห้งป่น 4ชต., กะปิ 2ชต., กระเทียม 1หัว, พริกขี้หนู 10เม็ด, มะอึก 1-2ลูก, มะดันสับเส้นยาว 5-7ลูก, น้ำตาลปี๊บ 2ชต., น้ำปลา 1-2ชต., พริกชี้ฟ้า 5-7เม็ด :: โขลกกะปิ กระเทียม พริกให้ละเอียด | ผสมมะดันสับ มะอึก กุ้งแห้งป่น ปรุงรสด้วยน้ำปลา น้ำตาล
น้ำพริกเสวย สูตร 2 :: กุ้ง/ปู :: พริกขี้หนูสวน 30-40ก., กระเทียม 60-80ก., กะปิเผา 80-100ก., มะดันสับ 150-180ก., มะอึกซอย 80-100ก., กุ้งแห้งคั่วป่น 500ก., น้ำตาลปี๊บ 3-5ชต., น้ำปลา 3-4ชต. :: โขลกกะปิเผา พริกขี้หนู กระเทียม กุ้งแห้งป่น มะอึกให้เข้ากัน | ใส่มะดันสับ ปรุงรสด้วยน้ำปลา น้ำตาล เคล้าเบาๆ
น้ำพริกหนุ่ม สูตร 1 :: ผัก/ผลไม้ :: พริกหนุ่ม, หอมใหญ่หัวเล็ก, กระเทียม, มะเขือยาว, มะเขือเทศผลเล็ก, เกลือ :: คั่วหรือปิ้งเครื่องปรุงทั้งหมดให้หอม ตำรวมกับเกลือเล็กน้อย | ใส่น้ำร้อนนิดหน่อยคลุกเคล้า นำไปตั้งไฟให้เดือดหรือนึ่งให้สุก
น้ำพริกหนุ่ม สูตร 2 :: ผัก/ผลไม้ :: พริกหนุ่มเผา 12-15เม็ด, หอมแดงเผา 5-6หัว, กระเทียมเผา 5-6หัว, ปลาร้าปิ้งแกะเนื้อ 1ตัว, น้ำปลา 1-2ชต., น้ำตาลปี๊บ 1ชช., มะนาว 1-2ลูก :: โขลกพริก หอม กระเทียมเผา และเนื้อปลาร้าปิ้งให้ละเอียด | ปรุงรสด้วยน้ำปลา น้ำตาล มะนาว
น้ำพริกหนุ่มสูตรดั้งเดิม :: ผัก/ผลไม้ :: พริกชี้ฟ้าปิ้งฉีกเป็นเส้น 20เม็ด, เกลือป่น 1ชช., ผงชูรสหรือน้ำตาลทราย 1ชต. :: โขลกพริกชี้ฟ้าปิ้งเบาๆ จนพริกนุ่มและเหลว | โรยเกลือป่นและน้ำตาลทรายเล็กน้อย คลุกเคล้าให้เข้ากัน
น้ำพริกอีสาน :: ปลา/ปลาร้า :: ปลาต้มแกะเนื้อ, หอมแดง กระเทียม พริกสดคั่ว, ปลาร้าต้ม, มะนาว, น้ำปลา :: โขลกหอม กระเทียม พริกสดคั่วให้ละเอียด ใส่เนื้อปลาต้มโขลกให้ละเอียด | ใส่น้ำปลาร้าต้ม บีบมะนาว เติมน้ำปลา คลุกให้ทั่ว
น้ำพริกมะอึก :: กุ้ง/ปู :: พริกขี้หนูสด 10เม็ด, หอมแดง 1หัว, มะอึกขูดขนซอยบาง 4ลูก, กะปิดีเผา 1ชช., กุ้งแห้ง 1ชต., น้ำตาลปี๊บ 1ชช., น้ำตาลทราย 1/2ชช. :: โขลกกุ้งแห้ง กะปิ พริกขี้หนู น้ำตาล และหอมแดงให้เข้ากัน | ใส่มะอึกซอยใช้ช้อนเคล้าให้เข้ากัน
ส้มตำปลาร้า :: ปลา/ปลาร้า :: มะละกอสับ 1ถ้วย, มะเขือเทศสีดา 3ลูก, กระเทียม 10กลีบ, พริกขี้หนูสด 10เม็ด, น้ำมะนาว 1-2ชต., น้ำปลา 1/2ชต., น้ำปลาร้าต้มสุก 1ชต. :: โขลกกระเทียม พริกขี้หนูพอแตก ใส่มะละกอ มะเขือเทศผ่าซีก มะกอกฝาน | ปรุงรสด้วยน้ำปลา น้ำปลาร้า น้ำมะนาว โขลกเบาๆ พอเข้ากัน
ซุปหน่อไม้ สูตร 1 :: ปลา/ปลาร้า :: หน่อไม้ต้มขูดเส้นฝอย, น้ำใบย่านาง, น้ำปลา, เกลือ, น้ำปลาร้า, งาคั่วป่น, ข้าวเบือ, พริกป่น, สะระแหน่, ผักแพว, หอมสด, หอมแดง พริกสดโขลก :: ต้มหน่อไม้ในน้ำใบย่านาง ใส่พริกสด หอมแดงโขลก เติมเกลือ น้ำปลา น้ำปลาร้า และข้าวเบือ | ปล่อยให้เย็น โรยผักซอย งาคั่ว และพริกป่น
ซุปหน่อไม้ สูตร 2 :: ปลา/ปลาร้า :: หน่อไม้ลวกขูดเส้น 300ก., น้ำใบย่านาง 20ใบ, น้ำปลาร้า 50ก., เกลือ 5ก., น้ำปลา 12ก., น้ำมะนาว 30ก., ผักชีฝรั่ง ต้นหอม ใบสะระแหน่ซอย, งาขาวคั่ว, พริกป่น :: ต้มน้ำใบย่านางกับหน่อไม้ให้เดือด เติมน้ำปลาร้า เกลือ น้ำปลา | ตักใส่ถ้วย ปรุงรสด้วยน้ำมะนาว พริกป่น โรยงาคั่วและผักซอย
แจ่วบอง :: ปลา/ปลาร้า :: พริกแห้งคั่ว, ปลาร้าสับคั่ว, ตะไคร้ ข่า ใบมะกรูดซอยคั่ว, หัวหอม กระเทียมคั่ว, น้ำปลา, ผงชูรส :: โขลกพริก ข่า ตะไคร้ ใบมะกรูด หัวหอม กระเทียมคั่วให้ละเอียด | นำปลาร้าสับคั่วลงโขลกผสมให้เข้ากัน ปรุงรสด้วยน้ำปลา
แจ่วมะเขือเทศ :: ปลา/ปลาร้า :: มะเขือเทศย่าง 3ลูก, พริกเม็ดใหญ่ย่าง 15-20เม็ด, หอมย่าง 3หัว, กระเทียมย่าง, น้ำปลาร้าต้มสุกหรือน้ำปลา, มะนาว, พริกขี้หนู :: โขลกหอม กระเทียม พริกย่างให้ละเอียด ใส่มะเขือเทศปอกเปลือกตำให้เข้ากัน | ปรุงรสด้วยน้ำปลาร้าต้มสุก และมะนาวตามชอบ
`;

function parseBase() {
  return raw.trim().split('\n').map(line => {
    const parts = line.split(' :: ');
    const name = parts.shift() || '';
    const cat = parts.shift() || '';
    const ingStr = parts.shift() || '';
    const stepStr = parts.shift() || '';
    return {
      name: name.trim(),
      cat: cat.trim(),
      ing: ingStr.split(', ').map(s => s.trim()),
      step: stepStr.split(' | ').map(s => s.trim())
    };
  });
}

let custom = JSON.parse(localStorage.getItem('np_custom') || '[]');
let all = [...custom, ...parseBase()];
let cat = 'ทั้งหมด';

function draw() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = all.filter(r => (cat==='ทั้งหมด'||r.cat===cat) && (r.name.toLowerCase().includes(q) || r.ing.some(i=>i.toLowerCase().includes(q))));
  document.getElementById('st').textContent = `พบ ${list.length} เมนู (จากทั้งหมด ${all.length} เมนู)`;
  document.getElementById('grid').innerHTML = list.length ? list.map(r => `
    <div class="card" onclick="show(${all.indexOf(r)})">
      <span class="tag">${r.cat}</span>
      <h3 style="margin:8px 0">${r.name}</h3>
      <p style="font-size:13px;color:#666;margin:0">วัตถุดิบ: ${r.ing.slice(0,3).join(', ')}...</p>
    </div>`).join('') : '<p style="grid-column:1/-1;text-align:center;color:#888">ไม่พบเมนูที่ค้นหา</p>';
}

function show(i) {
  const r = all.at(i);
  document.getElementById('vCat').textContent = r.cat;
  document.getElementById('vName').textContent = r.name;
  document.getElementById('vIng').innerHTML = r.ing.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('vStep').innerHTML = r.step.map(x=>`<li>${x}</li>`).join('');
  openM('mView');
}

function setCat(c, el) {
  cat = c;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  draw();
}

function openM(id) { document.getElementById(id).style.display = 'flex'; }
function closeM(id) { document.getElementById(id).style.display = 'none'; }

function addNew() {
  const name = document.getElementById('nName').value.trim();
  const ing = document.getElementById('nIng').value.trim().split('\n').filter(Boolean);
  const step = document.getElementById('nStep').value.trim().split('\n').filter(Boolean);
  if(!name || !ing.length || !step.length) return alert('กรุณากรอกให้ครบทุกช่องครับ');
  custom.unshift({name, cat:document.getElementById('nCat').value, ing, step});
  localStorage.setItem('np_custom', JSON.stringify(custom));
  all = [...custom, ...parseBase()];
  document.getElementById('nName').value = document.getElementById('nIng').value = document.getElementById('nStep').value = '';
  closeM('mAdd');
  draw();
}

document.getElementById('q').addEventListener('input', draw);
draw();
</script>
